name: Build and Release Laksanasoft NetHunter Kernel

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile NetHunter Kernel (Samsung S10+ beyond2lte)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses5-dev \
            zip unzip curl wget git ca-certificates libarchive-tools xz-utils

      - name: Download Toolchains (AOSP Clang & GCC Cross-Compilers)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchains
          cd $GITHUB_WORKSPACE/toolchains

          # Download AOSP Clang 10 (r377782b)
          echo "Downloading AOSP Clang 10.0.4..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0cb1afdb060d6619a9837ab6866cf4adf2336416/clang-r377782b.tar.gz
          mkdir -p clang
          tar -xf clang-r377782b.tar.gz -C clang
          rm -f clang-r377782b.tar.gz

          # Download AOSP GCC 64-bit & 32-bit
          echo "Cloning GCC 64-bit..."
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          echo "Cloning GCC 32-bit..."
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Clone NetHunter Kernel Source
        run: |
          git clone --depth=1 -b nethunter-lineage-23.2 https://github.com/V0lk3n/nethunter_kernel_samsung_exynos9820.git $GITHUB_WORKSPACE/kernel

      - name: Configure NetHunter Defconfig
        run: |
          cd $GITHUB_WORKSPACE/kernel
          DEFCONFIG="arch/arm64/configs/exynos9820-beyond2lte_defconfig"

          echo "Applying NetHunter specific configs to $DEFCONFIG..."

          cat <<EOT >> $DEFCONFIG
          # System V IPC (Metasploit & PostgreSQL)
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_POSIX_MQUEUE=y

          # Wireless Packet Injection Subsystem
          CONFIG_CFG80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211=y
          CONFIG_MAC80211_MESH=y
          CONFIG_MAC80211_LEDS=y

          # External USB WiFi Dongle Drivers
          CONFIG_ATH9K_HTC=y
          CONFIG_CARL9170=y
          CONFIG_RTL8187=y
          CONFIG_RTL8XXXU=y
          CONFIG_RT2X00=y
          CONFIG_RT2800USB=y
          CONFIG_MT7601U=y

          # USB Gadget / BadUSB / DuckHunter & Storage
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_F_HID=y
          CONFIG_ISO9660_FS=y

          # Bluetooth Arsenal
          CONFIG_BT_HCIBTUSB=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=y
          CONFIG_BT_HIDP=y
          EOT

      - name: Build Kernel (make Image)
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang

          mkdir -p out
          make O=out exynos9820-beyond2lte_defconfig

          # Ensure all NetHunter flags are enabled in generated .config
          ./scripts/config --file out/.config --enable CONFIG_SYSVIPC
          ./scripts/config --file out/.config --enable CONFIG_SYSVIPC_SYSCTL
          ./scripts/config --file out/.config --enable CONFIG_POSIX_MQUEUE
          ./scripts/config --file out/.config --enable CONFIG_CFG80211
          ./scripts/config --file out/.config --enable CONFIG_CFG80211_WEXT
          ./scripts/config --file out/.config --enable CONFIG_MAC80211
          ./scripts/config --file out/.config --enable CONFIG_MAC80211_MESH
          ./scripts/config --file out/.config --enable CONFIG_ATH9K_HTC
          ./scripts/config --file out/.config --enable CONFIG_CARL9170
          ./scripts/config --file out/.config --enable CONFIG_RTL8187
          ./scripts/config --file out/.config --enable CONFIG_RT2800USB
          ./scripts/config --file out/.config --enable CONFIG_MT7601U
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_F_HID
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_MASS_STORAGE
          ./scripts/config --file out/.config --enable CONFIG_USB_F_HID
          ./scripts/config --file out/.config --enable CONFIG_ISO9660_FS
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIBTUSB
          ./scripts/config --file out/.config --enable CONFIG_BT_RFCOMM

          make -j$(nproc --all) O=out

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Kernel Image binary was not generated!"
            exit 1
          fi

          echo "Kernel compiled successfully! Image size: $(stat -c%s out/arch/arm64/boot/Image) bytes"

      - name: Package into AnyKernel3 (laksanasoftkernel.zip)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 $GITHUB_WORKSPACE/anykernel
          cd $GITHUB_WORKSPACE/anykernel

          # Salin Image hasil build
          cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image ./Image

          # Setup anykernel.sh untuk beyond2lte
          cat << 'EOF' > anykernel.sh
### AnyKernel3 Ramdisk Mod Script
## osm0sis @ xda-developers

### AnyKernel setup
# global properties
properties() { '
kernel.string=Kali NetHunter Kernel for Galaxy S10+ by Laksanasoft
do.devicecheck=1
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=beyond2lte
device.name2=SM-G975F
device.name3=SM-G975FD
device.name4=SM-G975N
device.name5=beyond2
supported.versions=
supported.patchlevels=
supported.vendorpatchlevels=
'; } # end properties

### AnyKernel install
## boot files attributes
boot_attributes() {
set_perm_recursive 0 0 755 644 $RAMDISK/*;
set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
} # end attributes

# boot shell variables
BLOCK=/dev/block/by-name/boot;
IS_SLOT_DEVICE=0;
RAMDISK_COMPRESSION=auto;
PATCH_VBMETA_FLAG=auto;

# import functions/variables and setup patching - see for reference (DO NOT REMOVE)
. tools/ak3-core.sh;

# boot install
dump_boot;

write_boot;
## end boot install
EOF

          sed -i 's/\r$//' anykernel.sh

          # Buat laksanasoftkernel.zip
          zip -r9 $GITHUB_WORKSPACE/laksanasoftkernel.zip * -x .git README.md *placeholder

          echo "Generated laksanasoftkernel.zip (Size: $(stat -c%s $GITHUB_WORKSPACE/laksanasoftkernel.zip) bytes)"

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laksanasoftkernel
          path: laksanasoftkernel.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: laksanasoftkernel.zip
          name: "Laksanasoft NetHunter Kernel ${{ github.ref_name }}"
          body: |
            ## Kali NetHunter Kernel for Samsung Galaxy S10+ (beyond2lte)
            - Chipset: Exynos 9820
            - Features: SysV IPC (Metasploit), mac80211 WiFi Injection, BadUSB HID, Bluetooth Arsenal, DriveDroid.
          draft: false
          prerelease: false
